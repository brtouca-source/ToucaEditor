name: Build Touca Editor 31.6 Android
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore and verify original offline models
        run: python3 tools/restore-models.py

      - name: Check editor sources
        working-directory: app/src/main/assets/touca-app
        run: npm run check

      - name: Run PC 31.6 core tests
        working-directory: app/src/main/assets/touca-app
        run: npm test

      - name: Build and lint testing APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug

      - name: Compute APK SHA-256
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ToucaEditor-31.6-Android-testing
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
          if-no-files-found: error
