name: Build Touca Editor 31.6 Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore original offline models
        run: python3 tools/restore-models.py
      - name: Check editor sources
        working-directory: app/src/main/assets/touca-app
        run: npm run check
      - name: Build installable testing APK
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ToucaEditor-31.6-Android-testing
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
