name: Build Leitor Facil v3.3 Fast Release

on:
  push:
    branches: ["leitor-facil-j7"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Restore stable Leitor Fácil signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/leitorfacil-signing
          key: leitor-facil-release-signing-v1

      - name: Ensure private release signing key
        shell: bash
        run: |
          set -euo pipefail
          SIGN_DIR="$HOME/.android/leitorfacil-signing"
          mkdir -p "$SIGN_DIR"
          if [ ! -f "$SIGN_DIR/release.jks" ]; then
            PASSWORD="$(openssl rand -hex 24)"
            printf '%s' "$PASSWORD" > "$SIGN_DIR/password.txt"
            chmod 600 "$SIGN_DIR/password.txt"
            keytool -genkeypair -noprompt               -keystore "$SIGN_DIR/release.jks"               -storepass "$PASSWORD"               -keypass "$PASSWORD"               -alias leitorfacil               -dname "CN=Leitor Facil,OU=ToucaBR,O=ToucaBR,C=BR"               -keyalg RSA -keysize 4096 -sigalg SHA256withRSA -validity 10950
            chmod 600 "$SIGN_DIR/release.jks"
          fi

      - name: Download Supertonic 3 INT8 offline voice model
        shell: bash
        run: |
          set -euxo pipefail
          cd LeitorFacil
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets
          curl -fL --retry 4 --retry-delay 3             "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-supertonic-3-tts-int8-2026-05-11.tar.bz2"             -o /tmp/supertonic.tar.bz2
          mkdir -p /tmp/supertonic
          tar -xjf /tmp/supertonic.tar.bz2 -C /tmp/supertonic
          mv /tmp/supertonic/sherpa-onnx-supertonic-3-tts-int8-2026-05-11 app/src/main/assets/model
          test -f app/src/main/assets/model/duration_predictor.int8.onnx
          test -f app/src/main/assets/model/text_encoder.int8.onnx
          test -f app/src/main/assets/model/vector_estimator.int8.onnx
          test -f app/src/main/assets/model/vocoder.int8.onnx
          test -f app/src/main/assets/model/voice.bin

      - name: Verify privacy manifest
        shell: bash
        run: |
          set -euxo pipefail
          cd LeitorFacil
          ! grep -R "android.permission.INTERNET" app/src/main/AndroidManifest.xml
          ! grep -R "android.permission.CAMERA" app/src/main/AndroidManifest.xml
          ! grep -R "android.permission.RECORD_AUDIO" app/src/main/AndroidManifest.xml
          ! grep -R "READ_CONTACTS\|READ_MEDIA\|READ_EXTERNAL_STORAGE\|ACCESS_FINE_LOCATION" app/src/main/AndroidManifest.xml

      - name: Build universal APK
        shell: bash
        run: |
          set -euxo pipefail
          cd LeitorFacil
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../LeitorFacil-v3.3-Unsigned.apk
          cd ..
          unzip -l LeitorFacil-v3.3-Unsigned.apk | grep "lib/armeabi-v7a/"
          unzip -l LeitorFacil-v3.3-Unsigned.apk | grep "lib/arm64-v8a/"
          unzip -l LeitorFacil-v3.3-Unsigned.apk | grep "assets/model/voice.bin"

      - name: Sign and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          SIGN_DIR="$HOME/.android/leitorfacil-signing"
          PASSWORD="$(cat "$SIGN_DIR/password.txt")"
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          "$ZIPALIGN" -f -p 4             LeitorFacil-v3.3-Unsigned.apk             LeitorFacil-v3.3-Aligned.apk

          "$APKSIGNER" sign             --ks "$SIGN_DIR/release.jks"             --ks-key-alias leitorfacil             --ks-pass "pass:$PASSWORD"             --key-pass "pass:$PASSWORD"             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out LeitorFacil-v3.3-Fast-Signed.apk             LeitorFacil-v3.3-Aligned.apk

          "$APKSIGNER" verify --verbose --print-certs             LeitorFacil-v3.3-Fast-Signed.apk | tee signing-verification.txt
          sha256sum LeitorFacil-v3.3-Fast-Signed.apk             | tee LeitorFacil-v3.3-Fast-Signed.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: LeitorFacil-v3.3-Fast-Signed
          path: |
            LeitorFacil-v3.3-Fast-Signed.apk
            LeitorFacil-v3.3-Fast-Signed.apk.sha256
            signing-verification.txt
          if-no-files-found: error
