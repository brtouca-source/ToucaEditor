name: Build Leitor Facil Universal

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Download PT-BR neural voice
        shell: bash
        run: |
          set -euxo pipefail
          cd LeitorFacil
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets
          curl -fL --retry 4 --retry-delay 3             "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-edresson-low.tar.bz2"             -o /tmp/voice.tar.bz2
          tar -xjf /tmp/voice.tar.bz2 -C /tmp
          mv /tmp/vits-piper-pt_BR-edresson-low app/src/main/assets/model

      - name: Build APK
        shell: bash
        run: |
          cd LeitorFacil
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../LeitorFacil-Universal-v2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LeitorFacil-Universal-v2
          path: LeitorFacil-Universal-v2.apk
          if-no-files-found: error
